# Codemagic CI — the signed device build only. Unverified until it has run once.
#
# The unsigned simulator build lives in .github/workflows/ios-compile.yml instead. It is
# already proven, it screenshots every screen, and GitHub's minutes are the cheaper pool
# to burn on a check that runs on every push. Codemagic's 500 free macOS minutes a month
# are reserved for the thing only Codemagic can do without a Mac: sign.

workflows:
  testflight:
    name: Device build to TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      # Must match the integration name in Codemagic exactly, character for character.
      app_store_connect: NextStop ASC key
    environment:
      xcode: latest
      # No `ios_signing:` block on purpose. It only ever *fetches* existing signing files,
      # so on an account that has never produced a provisioning profile it fails before a
      # single script runs, with "No matching profiles found". The signing files are
      # created explicitly below instead.
      #
      # Supplies CERT_KEY_B64. A certificate is useless without its private key, and the
      # key belonging to one generated in the Codemagic UI is not readable by the CLI —
      # hence "Cannot save Signing Certificates without certificate private key".
      # Bringing our own key means the certificate is ours to reuse indefinitely.
      groups:
        - code_signing
      vars:
        # Not a credential — the team ID is embedded in every distributed build and is
        # readable from any IPA. Kept here so the build has no untracked inputs.
        DEVELOPMENT_TEAM: "LDHQJK9Y3D"
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate the Xcode project
        script: |
          cd ios
          # Written rather than copied from the example: that one leaves the team empty,
          # which is right for simulator builds and wrong here. Nothing else is set, so
          # there is nothing for `use-profiles` to have to override.
          printf 'DEVELOPMENT_TEAM = %s\nCURRENT_PROJECT_VERSION = %s\n' \
            "$DEVELOPMENT_TEAM" "$BUILD_NUMBER" > Signing.xcconfig
          cat Signing.xcconfig
          xcodegen generate
      - name: Create signing files
        script: |
          set -e
          keychain initialize

          # Carried base64 because a PEM key pasted into a web form loses its line breaks,
          # and the CLI rejects the flattened result outright. Decoding to a file and
          # passing it by path puts the newlines back and keeps the key out of argv.
          printf '%s' "$CERT_KEY_B64" | openssl base64 -d -A > "$HOME/cert_key.pem"

          # One call, not one per target. The identifier is matched as a prefix, so this
          # already covers com.kaichuan.nextstop.widget and creates a profile for each.
          # Calling it again for the widget re-saves the same certificate under a second
          # filename, and the duplicate then fails to import — "SecKeychainItemImport:
          # Unable to decode the provided data" — leaving the keychain half populated.
          app-store-connect fetch-signing-files com.kaichuan.nextstop \
            --type IOS_APP_STORE --create \
            --certificate-key "@file:$HOME/cert_key.pem"

          keychain add-certificates

      - name: Apply signing settings
        script: |
          # "Failed to set code signing settings" names no cause, so show what the command
          # actually has to work with: two profiles, one per target, and one usable
          # identity. Both directories are searched, and they are not the same one.
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/" || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          security find-identity -v -p codesigning || true
          # The plain failure message carries no cause, and -v only makes the CLI wrapper
          # chattier. This flag is the one that surfaces the error from the code that
          # actually patches the project.
          xcode-project use-profiles \
            --project ios/NextStop.xcodeproj \
            --code-signing-setup-verbose-logging
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/NextStop.xcodeproj \
            --scheme NextStop
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get the build the moment processing finishes. Beta review is
        # only needed for external testers, and would add a wait to every iteration of a
        # test that is already slow enough.
        submit_to_testflight: false
