name: NextStop

options:
  bundleIdPrefix: com.kaichuan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# No `configFiles:` here. A project-level xcconfig is emitted by XcodeGen as a file
# reference belonging to no group, and anything reading the project with the xcodeproj
# gem — Codemagic's signing setup among them — dies on it with "Consistency issue: no
# parent for object `Signing.xcconfig`". Xcode repairs the project silently when it opens
# one, which is why the defect survives; there is no Xcode here to do that.
# The team is written into the project by `xcode-project use-profiles`, and the build
# number is passed on the xcodebuild command line, so nothing needs an xcconfig.

settings:
  base:
    # Swift 5 language mode on purpose. Swift 6 strict concurrency turns first bring-up
    # into a wall of actor-isolation errors, and this spike is here to answer a question
    # about iOS, not to litigate sendability. Revisit for Phase 2.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Only a default. App Store Connect rejects a build number it has already accepted, so
    # CI overrides this per build from the command line, which outranks project settings.
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  NextStop:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: NextStopWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.nextstop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/NextStop-Info.plist
      properties:
        CFBundleDisplayName: NextStop
        # XcodeGen's defaults for these two are the literals "1.0" and "1", so without
        # them the build number never changes and the second upload is rejected as a
        # duplicate. Referencing the build settings is what lets CI vary it.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # The value stays false: the app makes only standard HTTPS calls to Transport NSW,
        # and platform TLS is exempt from the export-encryption question. Without this key
        # every upload sits in TestFlight as "Missing Compliance", which blocks install.
        ITSAppUsesNonExemptEncryption: false
        # Everything below lives in the plist rather than as INFOPLIST_KEY_* build
        # settings. Recent Xcode treats both as sources of truth and emits duplicate-key
        # errors when a target has one of each.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Upload validation demands all four for iPad regardless of TARGETED_DEVICE_FAMILY.
        # The iPhone key above is the one that governs how the app actually behaves.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without this the Live Activity request fails at runtime with an error that
        # reads like a code bug rather than a missing key.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          NextStop uses your location to plan journeys from where you are and to keep the
          arrival countdown updating while your phone is locked. Nothing is uploaded or
          stored off the device.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          NextStop uses your location to plan journeys from where you are and to keep the
          arrival countdown updating while your phone is locked. Nothing is uploaded or
          stored off the device.
    entitlements:
      path: Generated/NextStop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaichuan.nextstop

  NextStopWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.nextstop.widget
        SKIP_INSTALL: YES
    info:
      path: Generated/NextStopWidget-Info.plist
      properties:
        CFBundleDisplayName: NextStop
        # An embedded extension whose version differs from its host app is rejected on
        # upload, so both must resolve from the same build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/NextStopWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaichuan.nextstop
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  NextStopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: NextStop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # An unhosted XCTest bundle has no keychain access group, and every Keychain
        # test then fails with errSecMissingEntitlement (-34018). Hosting it in the app
        # is the fix, and it is cheaper to set now than to diagnose over a 5-minute loop.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NextStop.app/NextStop"
        BUNDLE_LOADER: "$(TEST_HOST)"

# Declared explicitly rather than left to XcodeGen's defaults: `xcodebuild test` only runs
# a test target attached to the scheme's test action, and declaring any scheme replaces
# the one XcodeGen would have generated — so the build targets must be listed too.
schemes:
  NextStop:
    build:
      targets:
        NextStop: all
        NextStopTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NextStopTests
