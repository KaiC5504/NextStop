name: iOS compile check

# Unsigned simulator build. Needs no Apple Developer account, so it can prove the spike
# compiles while enrolment is still pending. Device builds live in codemagic.yaml.

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-compile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # First run is partly diagnostic: the project targets iOS 26, and a runner whose
      # newest SDK is older than that fails with an error that reads like a code fault.
      - name: Toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd ios
          xcodegen generate

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' in runtime:
                  for device in devices:
                      if 'iPhone' in device['name']:
                          print(device['udid'])
                          raise SystemExit
          ")
          echo "Booting $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          # Ad-hoc signed rather than CODE_SIGNING_ALLOWED=NO. Skipping signing entirely
          # also skips embedding entitlements, which makes the App Group container nil and
          # fires the app's misconfiguration banner for a reason that is purely a build
          # artifact. Ad-hoc needs no team but still applies entitlements.
          xcodebuild \
            -project ios/NextStop.xcodeproj \
            -scheme NextStop \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/NextStop.xcodeproj \
            -scheme NextStop \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      # Compiling only proves it parses. Launching proves it does not crash on the first
      # screen, and the screenshots are the only way to see the UI before there is a
      # provisioned device to install on.
      - name: Launch and screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/NextStop.app
          # The simulator has no compass and grants nothing by default, so the user puck
          # only appears in screenshots with a granted permission, a simulated position,
          # and the app's -fakeHeading escape hatch.
          xcrun simctl privacy "$UDID" grant location com.kaichuan.nextstop || true
          xcrun simctl location "$UDID" set -33.8688,151.2093 || true
          mkdir -p shots
          for screen in home search settings layouts; do
            xcrun simctl terminate "$UDID" com.kaichuan.nextstop 2>/dev/null || true
            sleep 3
            echo "--- launching $screen ---"
            xcrun simctl launch "$UDID" com.kaichuan.nextstop -initialScreen "$screen" -fakeHeading 45
            # A blank first screenshot suggested the launch screen was still up, so give
            # SwiftUI real time rather than guessing again.
            sleep 15
            xcrun simctl io "$UDID" screenshot "shots/$screen.png"
          done
          ls -la shots

      - name: Collect crash reports
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "NextStop*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          if [ -n "$(ls -A shots/crashes 2>/dev/null)" ]; then
            echo "CRASHES FOUND:"
            ls -la shots/crashes
            head -60 shots/crashes/* || true
          else
            echo "no crash reports — any blank screen is a layout or timing issue, not a crash"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
