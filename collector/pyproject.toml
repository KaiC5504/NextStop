[project]
name = "nextstop-collector"
version = "0.1.0"
description = "Phase 0 data collection: TfNSW published timetable vs Trip Planner realtime"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gtfs-realtime-bindings>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "pandas>=2.2",
    "matplotlib>=3.10",
]

[project.scripts]
nextstop = "nextstop_collector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextstop_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
