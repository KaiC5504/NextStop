name: NextStop

options:
  bundleIdPrefix: com.kaichuan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    # Swift 5 language mode on purpose. Swift 6 strict concurrency turns first bring-up
    # into a wall of actor-isolation errors, and this spike is here to answer a question
    # about iOS, not to litigate sendability. Revisit for Phase 2.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # CURRENT_PROJECT_VERSION deliberately absent: set here it would land in the project's
    # build settings, which shadow the xcconfig, and CI could no longer vary it. App Store
    # Connect rejects a build number it has already seen, so every upload needs a new one.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  NextStop:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - target: NextStopWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.nextstop
    info:
      path: Generated/NextStop-Info.plist
      properties:
        CFBundleDisplayName: NextStop
        # Without this every upload sits in TestFlight as "Missing Compliance" until the
        # export-encryption question is answered by hand, which blocks install. The spike
        # makes no network calls at all, so the answer is always the same one.
        ITSAppUsesNonExemptEncryption: false
        # Everything below lives in the plist rather than as INFOPLIST_KEY_* build
        # settings. Recent Xcode treats both as sources of truth and emits duplicate-key
        # errors when a target has one of each.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without this the Live Activity request fails at runtime with an error that
        # reads like a code bug rather than a missing key.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          NextStop uses your location to keep the arrival countdown updating while your
          phone is locked. Nothing is uploaded or stored off the device.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          NextStop uses your location to keep the arrival countdown updating while your
          phone is locked. Nothing is uploaded or stored off the device.
    entitlements:
      path: Generated/NextStop.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaichuan.nextstop

  NextStopWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.nextstop.widget
        SKIP_INSTALL: YES
    info:
      path: Generated/NextStopWidget-Info.plist
      properties:
        CFBundleDisplayName: NextStop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/NextStopWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaichuan.nextstop
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
